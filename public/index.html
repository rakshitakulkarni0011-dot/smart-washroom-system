<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Washroom System</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <h1>🚻 Smart Washroom Monitoring System</h1>

  <div class="center">
    <button class="bigBtn" onclick="showLogin()">🔐 Login</button>
    <button class="bigBtn" onclick="showSignup()">📝 Sign Up</button>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="card formBox" style="display:none;">
    <h2>🔐 Login</h2>
    <div id="loginError" class="error"></div>

    <input id="loginPhone" type="text" placeholder="📱 Mobile Number" maxlength="10"
      oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    <input id="loginPass" type="password" placeholder="🔒 Password">

    <select id="loginRole">
      <option value="User">User</option>
      <option value="Employee">Employee</option>
      <option value="Admin">Admin</option>
    </select>

    <button onclick="login()">Login</button>
    <button onclick="hideForms()">Back</button>
  </div>

  <!-- SIGNUP -->
  <div id="signupBox" class="card formBox" style="display:none;">
    <h2>📝 Sign Up</h2>
    <div id="signupError" class="error"></div>

    <input id="name" placeholder="Name">
    <input id="phone" type="text" placeholder="Mobile Number" maxlength="10"
      oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    <input id="pass" type="password" placeholder="Password">

    <select id="signupRole">
      <option value="User">User</option>
      <option value="Employee">Employee</option>
      <option value="Admin">Admin</option>
    </select>

    <button onclick="signup()">Create Account</button>
    <button onclick="hideForms()">Back</button>
  </div>

  <script>

    // 🌐 LIVE RENDER API
    const API = "https://smart-washroom-system.onrender.com/api";

    function showLogin() {
      loginBox.style.display = "block";
      signupBox.style.display = "none";
    }

    function showSignup() {
      signupBox.style.display = "block";
      loginBox.style.display = "none";
    }

    function hideForms() {
      loginBox.style.display = "none";
      signupBox.style.display = "none";
    }

    // ================= SIGNUP =================
    async function signup() {

      const data = {
        name: name.value,
        phone: phone.value,
        password: pass.value,
        role: signupRole.value
      };

      try {
        const res = await fetch(`${API}/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (!res.ok) {
          alert(result.error || "Signup failed");
          return;
        }

        alert("Signup successful 🎉");
        redirect(result.role);

      } catch {
        alert("Server error");
      }
    }

    // ================= LOGIN =================
    async function login() {

      const data = {
        phone: loginPhone.value,
        password: loginPass.value
      };

      const selectedRole = loginRole.value;

      try {
        const res = await fetch(`${API}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (!res.ok) {
          alert(result.error || "Login failed");
          return;
        }

        if (result.role !== selectedRole) {
          alert("Wrong role selected");
          return;
        }

        alert("Login successful 🎉");
        redirect(result.role);

      } catch {
        alert("Server error");
      }
    }

    // ================= REDIRECT =================
    function redirect(role) {
      if (role === "Admin") window.location = "admin.html";
      else if (role === "Employee") window.location = "employee.html";
      else window.location = "user.html";
    }

  </script>

</body>

</html>
