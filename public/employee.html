<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Dashboard</title>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f4f7fb;
      margin: 0
    }

    .navbar {
      background: #2b7cff;
      color: #fff;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between
    }

    .container {
      padding: 20px
    }

    .section {
      background: #fff;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px #ccc
    }

    .job-card {
      background: #f9fbff;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      border-left: 6px solid #2b7cff
    }

    button {
      margin: 5px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #2b7cff;
      color: white;
      cursor: pointer
    }

    .callPopup {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px #aaa;
      display: none
    }
  </style>

</head>

<body>

  <div class="navbar">
    <h2>🧹 Employee Panel</h2>
    <button onclick="logout()">Sign Out</button>
  </div>

  <div class="container">

    <div class="section">
      <h2>📞 Incoming Job Call</h2>
      <p id="callMsg">Waiting for job call...</p>
    </div>

    <div class="section">
      <h2>🟡 Assigned Tasks</h2>
      <div id="assignedJobs"></div>
    </div>

    <div class="section">
      <h2>🟢 Completed Tasks</h2>
      <div id="completedJobs"></div>
    </div>

  </div>

  <div class="callPopup" id="callPopup">
    <h3>📞 New Cleaning Job</h3>
    <p>You have a new cleaning task!</p>
    <button onclick="acceptPopup()">Accept</button>
    <button onclick="declinePopup()">Decline</button>
  </div>

  <script>

    // 🌐 LIVE SERVER URL
    const SERVER = "https://smart-washroom-system.onrender.com";

    // 🔌 SOCKET CONNECT
    const socket = io(SERVER);

    // 📞 Incoming call from admin
    socket.on("call-employee", (phone) => {
      document.getElementById("callMsg").innerHTML = "📞 Calling: " + phone;
      document.getElementById("callPopup").style.display = "block";
    });

    // 🔄 refresh when admin updates job
    socket.on("job-update", loadJobs);

    // ================= LOAD JOBS =================
    async function loadJobs() {
      try {
        const res = await fetch(`${SERVER}/jobs`);
        const data = await res.json();

        const assigned = document.getElementById("assignedJobs");
        const completed = document.getElementById("completedJobs");

        assigned.innerHTML = "";
        completed.innerHTML = "";

        data.jobs.forEach(job => {
          const card = `
        <div class="job-card">
          <h3>${job.location}</h3>
          <p>Status: <b>${job.status}</b></p>
          <p>Employee Phone: ${job.employeePhone}</p>

          ${job.status != "Completed" ? `
            <button onclick="doneJob('${job._id}')">✔ Done</button>
          ` : ""}
        </div>
      `;

          if (job.status == "Completed") completed.innerHTML += card;
          else assigned.innerHTML += card;
        });

      } catch {
        console.log("Server sleeping… retrying");
      }
    }

    // auto refresh every 5 sec
    loadJobs();
    setInterval(loadJobs, 5000);

    // ================= JOB ACTION =================
    function doneJob(id) {
      fetch(`${SERVER}/job-done/${id}`);
      alert("Job marked as completed ✅");
    }

    // popup buttons
    function acceptPopup() {
      callPopup.style.display = "none";
      alert("You accepted the call 📞");
    }
    function declinePopup() {
      callPopup.style.display = "none";
    }

    // logout
    function logout() {
      window.location = "index.html";
    }

  </script>

</body>

</html>
