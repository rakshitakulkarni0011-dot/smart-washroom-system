<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Dashboard</title>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f4f7fb;
      margin: 0
    }

    .navbar {
      background: #2b7cff;
      color: #fff;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      padding: 20px
    }

    .section {
      background: #fff;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px #ccc;
    }

    .job-card {
      background: #f9fbff;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      border-left: 6px solid #2b7cff;
    }

    button {
      margin: 5px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #2b7cff;
      color: white;
      cursor: pointer;
    }

    .callPopup {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px #aaa;
      display: none;
    }
  </style>

</head>

<body>

  <div class="navbar">
    <h2>🧹 Employee Panel</h2>
    <button onclick="logout()">Sign Out</button>
  </div>

  <div class="container">

    <div class="section">
      <h2>📞 Incoming Job Call</h2>
      <p id="callMsg">No incoming calls</p>
    </div>

    <div class="section">
      <h2>🟡 Assigned Tasks</h2>
      <div id="assignedJobs"></div>
    </div>

    <div class="section">
      <h2>🟢 Completed Tasks</h2>
      <div id="completedJobs"></div>
    </div>

  </div>

  <div class="callPopup" id="callPopup">
    <h3>📞 New Cleaning Job</h3>
    <p id="popupText">You have a new cleaning task!</p>
    <button onclick="acceptPopup()">Accept</button>
    <button onclick="declinePopup()">Decline</button>
  </div>

  <script>

    const socket = io("http://localhost:5000");
    let incomingPhone = null;
    let incomingJobId = null;

    // 📞 When backend triggers call
    socket.on("call-employee", (phone) => {
      incomingPhone = phone;
      document.getElementById("callMsg").innerHTML =
        "📞 Calling employee: " + phone;
      document.getElementById("callPopup").style.display = "block";
    });

    // 🔄 Live job refresh
    socket.on("job-update", loadJobs);

    async function loadJobs() {
      const res = await fetch("http://localhost:5000/jobs");
      const data = await res.json();

      const assigned = document.getElementById("assignedJobs");
      const completed = document.getElementById("completedJobs");

      assigned.innerHTML = "";
      completed.innerHTML = "";

      data.jobs.forEach(job => {
        const card = `
      <div class="job-card">
        <h3>${job.location}</h3>
        <p>Status: <b>${job.status}</b></p>
        <p>Employee: ${job.employeePhone}</p>

        ${job.status != "Completed" ? `
        <button onclick="acceptJob('${job._id}')">Accept</button>
        <button onclick="doneJob('${job._id}')">Done</button>
        <button onclick="declineJob('${job._id}')">Decline</button>
        ` : ""}
      </div>
    `;

        if (job.status == "Completed")
          completed.innerHTML += card;
        else
          assigned.innerHTML += card;
      });
    }

    loadJobs();
    setInterval(loadJobs, 4000);

    // BUTTON ACTIONS
    function acceptJob(id) {
      fetch(`http://localhost:5000/job-accepted/${id}`);
    }
    function doneJob(id) {
      fetch(`http://localhost:5000/job-done/${id}`);
    }
    function declineJob(id) {
      fetch(`http://localhost:5000/job-declined/${id}`);
    }

    // popup buttons
    function acceptPopup() {
      document.getElementById("callPopup").style.display = "none";
      alert("📞 You accepted the call!");
    }
    function declinePopup() {
      document.getElementById("callPopup").style.display = "none";
      alert("📞 You declined the call!");
    }

    // logout
    function logout() {
      window.location.href = "index.html";
    }

  </script>

</body>

</html>
