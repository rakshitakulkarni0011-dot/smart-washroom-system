<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Smart Washroom Admin</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>

<body>

  <div class="topbar">
    <h2>Admin Dashboard</h2>
    <div>
      <span class="statusDot" id="serverDot"></span>
      <span id="serverStatus">Connecting...</span>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">

    <div class="card">
      <h3>Sensor Health</h3>
      <p>Temperature: <span id="tStatus">--</span></p>
      <p>Humidity: <span id="hStatus">--</span></p>
      <p>IR Sensor: <span id="irStatus">--</span></p>
      <p>MQ135 Gas: <span id="mqStatus">--</span></p>
    </div>

    <div class="card">
      <h3>Live Readings</h3>
      <p>🌡 Temp: <span class="big" id="temp">--</span> °C</p>
      <p>💧 Humidity: <span class="big" id="hum">--</span> %</p>
      <p>🚶 Users: <span class="big" id="users">--</span></p>
      <p>🧹 Cleanliness: <span class="big" id="clean">--</span>/100</p>
    </div>

    <div class="card">
      <h3>Air Quality</h3>
      <p>Gas Level: <span class="big" id="mq">--</span> ppm</p>
      <p>Status: <span id="airStatus">--</span></p>
    </div>

    <div class="card">
      <h3>Employees</h3>
      <div id="empList">Loading...</div>
    </div>

    <div class="card">
      <h3>Temperature</h3><canvas id="tempChart"></canvas>
    </div>
    <div class="card">
      <h3>Humidity</h3><canvas id="humChart"></canvas>
    </div>
    <div class="card">
      <h3>Users</h3><canvas id="userChart"></canvas>
    </div>

  </div>

  <script>
    const socket = io(); // auto connect same server

    // ELEMENTS
    const tempEl = document.getElementById("temp");
    const humEl = document.getElementById("hum");
    const usersEl = document.getElementById("users");
    const cleanEl = document.getElementById("clean");
    const mqEl = document.getElementById("mq");
    const empList = document.getElementById("empList");

    const tStatus = document.getElementById("tStatus");
    const hStatus = document.getElementById("hStatus");
    const irStatus = document.getElementById("irStatus");
    const mqStatus = document.getElementById("mqStatus");
    const airStatus = document.getElementById("airStatus");

    // SERVER STATUS
    socket.on("connect", () => { serverDot.style.background = "#22c55e"; serverStatus.innerText = "Live" });
    socket.on("disconnect", () => { serverDot.style.background = "#ef4444"; serverStatus.innerText = "Disconnected" });

    // LIVE SENSOR UPDATE
    socket.on("sensor-update", updateUI);

    function updateUI(d) {
      if (!d) return;
      tempEl.innerText = d.temperature ?? "--";
      humEl.innerText = d.humidity ?? "--";
      usersEl.innerText = d.peopleCount ?? "--";
      cleanEl.innerText = d.cleanlinessScore ?? "--";
      mqEl.innerText = d.gas ?? "--";

      // air quality
      if (d.gas > 400) { airStatus.innerText = "Bad"; airStatus.className = "bad"; }
      else if (d.gas > 250) { airStatus.innerText = "Moderate"; airStatus.className = "warn"; }
      else { airStatus.innerText = "Good"; airStatus.className = "ok"; }

      // sensor health
      tStatus.innerText = d.temperature != null ? "Working" : "Offline";
      hStatus.innerText = d.humidity != null ? "Working" : "Offline";
      irStatus.innerText = d.peopleCount != null ? "Working" : "Offline";
      mqStatus.innerText = d.gas != null ? "Working" : "Offline";
    }

    // FETCH LATEST
    fetch("/api/sensor/latest").then(r => r.json()).then(updateUI);

    // EMPLOYEES
    fetch("/api/employees").then(r => r.json()).then(data => {
      empList.innerHTML = data.map(e => `<p>${e.name} (${e.status})</p>`).join("");
    });

    // CHARTS
    const createChart = id => new Chart(document.getElementById(id), {
      type: "line",
      data: { labels: [], datasets: [{ data: [] }] }
    });
    const tempChart = createChart("tempChart");
    const humChart = createChart("humChart");
    const userChart = createChart("userChart");

    fetch("/api/sensor/history").then(r => r.json()).then(h => {
      const labels = h.map(x => new Date(x.createdAt).toLocaleTimeString());
      tempChart.data.labels = humChart.data.labels = userChart.data.labels = labels;
      tempChart.data.datasets[0].data = h.map(x => x.temperature);
      humChart.data.datasets[0].data = h.map(x => x.humidity);
      userChart.data.datasets[0].data = h.map(x => x.peopleCount);
      tempChart.update(); humChart.update(); userChart.update();
    });

    function logout() { location = "index.html"; }
  </script>
</body>

</html>
